# Deploy with Render Dashboard → New → Blueprint (not a plain Web Service).
# A normal Web Service will NOT read this file — set env vars manually (see RENDER_DEPLOY.md).
services:
  - type: web
    name: backend-logistics
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backend-logistics-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: backend-logistics-db
    plan: free
